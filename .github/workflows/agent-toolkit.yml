name: Agent toolkit integrity

on:
  pull_request:
    paths:
      - 'tools/agent-toolkit/**'
      - '.github/workflows/agent-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-toolkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Test installer with synthetic fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tools/agent-toolkit -p 'test_kit.py' -v
      - name: Install verified sources into an isolated project
        run: |
          target="$RUNNER_TEMP/pu-agent-kit"
          mkdir -p "$target"
          cp AGENTS.md "$target/AGENTS.md"
          python3 tools/agent-toolkit/kit.py install --project "$target" --agent codex
          python3 tools/agent-toolkit/kit.py verify --project "$target"
      - name: Check Context-Mode MCP without host hooks or credentials
        run: python3 tools/agent-toolkit/kit.py smoke --project "$RUNNER_TEMP/pu-agent-kit"
      - name: Confirm no tracked application files changed
        run: git diff --exit-code
