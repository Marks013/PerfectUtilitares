name: One-time audited branch cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleanup-once-2026-11-20.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: perfectutilitares-branch-cleanup-once
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'Marks013/PerfectUtilitares'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Remove only audited and unchanged non-main refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUDITED_REFS: |
            audit/escalas-importacao-2026-11-20 23d59fc790ff08fd82af4d13ae789f0a7a44c013
            audit/escalas-importacao-segura-2026-11-20 c1e06aa9ed6b6bfb94371014782b368e189af77d
            audit/escalas-integracao-2026-11-19 bb53475dd1506d1f5c694fc9fcd907082d21181d
            chore/m1-protecao-toolchain-backup-2026-11-20 bc21afef7a50f72d6e14910425f49286f945762f
            chore/m4-benchmark-sintetico-2026-11-20 0a87a53fcf9b5f5b4e53069fcb628e0f715e60e7
            docs/m5-arquitetura-runbooks-2026-11-20 f6f3353e2336fd0c8bbbc1d5d34d645606a031f0
            feat/escalas-folgas-explicitas-2026-11-19 213e29ff08fc5af7d07c6524da13b06ff2a034c1
            feat/escalas-semana-domingo-2026-11-17 8b01062559a7f4e19703a5299b0cb7a068428f32
            fix/escalas-domingos-cobertura-2026-11-16 bee04e27dd0fa252d0fa9d3c2b4295bc44f44c39
            fix/escalas-seed-robusto-2026-11-18 17eda2182c296fa8261e397c5f7263752213d9e2
            fix/escalas-validacao-horarios-2026-11-20 298e906033afce7e5e0e39553b728a9b7326c4c3
            fix/m1-benchmark-week-start-2026-11-20 5c2d1a27d8f2d9c8b4db9bd084c69910c4f7febd
            fix/m3-cobertura-zero-presenca-2026-11-20 cc010e73af8e17d689071ffa0322190e557bb737
            fix/main-recover-after-pr47-2026-11-20 0eb33bd1465e168919abca432e2428ff73fd7a4c
            refactor/m4-escalas-cobertura-2026-11-20 a6911fc599423ca439c842878715dfd98e6f3864
            security/m2-credencial-escalas-opcional-2026-11-20 8bc39134330df05a2f99c81b7d4e89c2700bc709
            test/m4-escalas-publicacao-ui-2026-11-20 9e5efe07333e4edabde978ebfcddef3dc3d226d7
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Marks013/PerfectUtilitares"
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$GITHUB_SHA" = "$live_main" || { echo "main changed; refusing cleanup" >&2; exit 1; }
          open_count="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = "0" || { echo "Open PR detected; refusing cleanup" >&2; exit 1; }
          while read -r branch expected; do
            test -n "$branch" || continue
            test "$branch" != "main" || exit 1
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected" || { echo "Branch $branch changed; refusing cleanup" >&2; exit 1; }
          done <<< "$AUDITED_REFS"
          while read -r branch expected; do
            test -n "$branch" || continue
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$expected" || { echo "Branch $branch changed during cleanup; stopping" >&2; exit 1; }
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted $branch"
          done <<< "$AUDITED_REFS"
          remaining="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq 'map(.name) | join(",")')"
          test "$remaining" = "main" || { echo "Unexpected remaining refs: $remaining" >&2; exit 1; }
          echo "Exactly one remote branch remains: main"
