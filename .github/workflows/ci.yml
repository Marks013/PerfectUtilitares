name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Code, dependencies and PostgreSQL
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfectutilitares_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfectutilitares_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfectutilitares_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      ADMIN_EMAIL: admin-ci@example.test
      ADMIN_PASSWORD: ci-only-admin-password
      DEFAULT_TENANT_NAME: CI
      DEFAULT_TENANT_SLUG: ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit PR tree and deletion intent
        if: github.event_name == 'pull_request'
        working-directory: .
        run: node web/scripts/verify-pr-change-scope.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install PDF rendering tools for code regressions
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Validate and audit dependencies
        run: |
          npm ls --all
          npm audit --audit-level=moderate
          npm --prefix ops/pdf-worker audit --audit-level=moderate
          npm --prefix ops/migrator audit --audit-level=moderate
          npm run security:python
      - name: Deploy database migrations
        run: npm run prisma:generate && npm run db:deploy
      - name: Verify synthetic Escalas upgrade and recovery
        timeout-minutes: 6
        env:
          ESCALAS_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: node scripts/verify-escalas-upgrade-ci.mjs
      - name: Record exact source identity for quality diagnostics
        working-directory: .
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'quality-evidence'
          output.mkdir()
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'))
          tests = {}
          for path in sorted((root / 'web/src').rglob('*')):
              if not path.is_file() or path.is_symlink() or not path.name.endswith(('.test.ts', '.test.tsx')):
                  continue
              name = path.relative_to(root).as_posix()
              tests[name] = {'tracked': name in tracked, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
          source = {'checkout': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
                    'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(),
                    'requestedSha': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'tests': tests}
          (output / 'source.json').write_text(json.dumps(source, indent=2) + '\n')
          print(json.dumps({key: value for key, value in source.items() if key != 'tests'}))
          print('Test source files:', len(tests))
          PYTHON
      - name: Run checks without a browser
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm run quality:code 2>&1 | tee "$RUNNER_TEMP/quality-evidence/quality.log"
          statuses=("${PIPESTATUS[@]}")
          result=${statuses[0]}
          if [ "$result" -eq 0 ] && [ "${statuses[1]}" -ne 0 ]; then result=${statuses[1]}; fi
          printf '%s\n' "$result" > "$RUNNER_TEMP/quality-evidence/exit-code.txt"
          exit "$result"
      - name: Keep source-bound synthetic quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-source-evidence
          path: ${{ runner.temp }}/quality-evidence/
          retention-days: 3
          if-no-files-found: ignore
      - name: Smoke Prisma runtime
        run: npm run prisma:smoke
      - name: Ensure checks did not modify tracked files
        working-directory: .
        run: git diff --exit-code -- .

  solver:
    name: Solver and independent verifier
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production and development processors
        run: |
          docker build --target runtime -t web-escalas-solver -f ops/escalas/Dockerfile .
          docker build --target development -t web-escalas-solver-development -f ops/escalas/Dockerfile .
      - name: Run solver contracts (must pass before release)
        run: npm run test:escalas:python
      - name: Check Python code
        run: docker run --rm --read-only --network none --cpus 1 --memory 1536m --volume "$PWD/ops/escalas:/model:ro" --workdir /model --entrypoint /opt/solver/bin/ruff web-escalas-solver-development check --no-cache .
      - name: Verify SolverForge results independently in TypeScript
        run: npm run test:escalas:model
      - name: Verify generated property cases independently in TypeScript
        run: npm run test:escalas:properties

  browser:
    name: Production build and browser flows
    needs: [quality, solver]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfectutilitares_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfectutilitares_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfectutilitares_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      ADMIN_EMAIL: admin-ci@example.test
      ADMIN_PASSWORD: ci-only-admin-password
      DEFAULT_TENANT_NAME: CI
      DEFAULT_TENANT_SLUG: ci
      AUTH_URL: http://localhost:3002
      NEXTAUTH_URL: http://localhost:3002
      APP_URL: http://localhost:3002
      SOURCE_REVISION: ${{ github.sha }}
      E2E_PDF_WORKER_IMAGE: web-pdf-worker-e2e
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install PDF rendering tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Prepare production runtimes
        run: |
          docker build -t web-escalas-solver -f ops/escalas/Dockerfile .
          docker build --target pdf-worker --build-arg SOURCE_REVISION="$SOURCE_REVISION" --tag "$E2E_PDF_WORKER_IMAGE" .
      - name: Build web application
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Build PDF worker
        run: npm run build:pdf-worker
      - name: Run browser and persistence E2E once
        run: npm run test:e2e:isolated
        env:
          E2E_PRODUCTION: "1"
          E2E_EMPTY_TURNO_CATALOG: "1"
      - name: Keep scheduling interface audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: escalas-interface-evidence
          path: outputs/escalas-e2e-harness/**/test-results/**/escalas-audit-*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Keep synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-browser-failures
          path: outputs/escalas-e2e-harness/**/test-results/**/error-context.md
          retention-days: 3
          if-no-files-found: ignore
      - name: Ensure build did not modify tracked files
        working-directory: .
        run: git diff --exit-code -- .

  docker:
    name: Docker images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare non-secret CI environment
        working-directory: web
        run: |
          cp .env.example .env
          npm run setup:env
      - name: Validate Compose
        working-directory: web
        run: docker compose config --quiet
      - name: Build every runtime image
        working-directory: web
        run: docker compose build app migrate pdf-worker escalas-solver
