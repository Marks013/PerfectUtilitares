name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Quality, PostgreSQL and build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: perfectutilitares_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perfectutilitares_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: web

    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/perfectutilitares_ci?schema=public
      AUTH_SECRET: ci-only-secret-not-used-in-production
      ADMIN_EMAIL: admin-ci@example.test
      ADMIN_PASSWORD: ci-only-admin-password
      DEFAULT_TENANT_NAME: CI
      DEFAULT_TENANT_SLUG: ci
      AUTH_URL: http://localhost:3002
      NEXTAUTH_URL: http://localhost:3002
      APP_URL: http://localhost:3002
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Validate dependency tree
        run: npm ls --all

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Deploy database migrations
        run: npm run prisma:generate && npm run db:deploy

      - name: Run quality checks
        run: npm run quality

      - name: Smoke Prisma runtime
        run: npm run prisma:smoke

      - name: Build web application
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build PDF worker
        run: npm run build:pdf-worker

      - name: Run browser and persistence E2E
        run: npm run test:e2e
        env:
          E2E_MUTATION: "1"

      - name: Ensure build did not modify tracked files
        working-directory: .
        run: git diff --exit-code -- .

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Prepare non-secret CI environment
        working-directory: web
        run: |
          cp .env.example .env
          npm run setup:env

      - name: Validate Compose
        working-directory: web
        run: docker compose config --quiet

      - name: Build every runtime image
        working-directory: web
        run: docker compose build app migrate pdf-worker
