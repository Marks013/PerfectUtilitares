name: One-time PR 51 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-integrated-pr51-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: perfectutilitares-cleanup-pr51-once
  cancel-in-progress: false

jobs:
  prune-merged-branch:
    if: github.repository == 'Marks013/PerfectUtilitares'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the unchanged and merged PR 51 head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ci/pr-tree-integrity-2026-11-20
          EXPECTED_HEAD: a08b879e9562cfee5ff0f14915349b0eb5b1ab15
        run: |
          set -euo pipefail
          repo="Marks013/PerfectUtilitares"
          current_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || { echo "Main moved; refusing cleanup" >&2; exit 1; }
          merged="$(gh api "repos/$repo/pulls/51" --jq '.merged')"
          head="$(gh api "repos/$repo/pulls/51" --jq '.head.sha')"
          test "$merged" = "true" && test "$head" = "$EXPECTED_HEAD" || { echo "PR 51 not merged at expected head" >&2; exit 1; }
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = "0" || { echo "Open PR detected" >&2; exit 1; }
          current_ref="$(gh api "repos/$repo/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$current_ref" = "$EXPECTED_HEAD" || { echo "Branch moved; refusing to delete" >&2; exit 1; }
          gh api -X DELETE "repos/$repo/git/refs/heads/$TARGET_BRANCH" >/dev/null
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq 'map(.name) | join(",")')"
          test "$remaining" = "main" || { echo "Unexpected branches remain: $remaining" >&2; exit 1; }
          echo "Success: only main remains"
