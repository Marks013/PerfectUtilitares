name: One-time PR 52 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-integrated-pr52-once.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: perfectutilitares-cleanup-pr52-once
  cancel-in-progress: false

jobs:
  prune-merged-branch:
    if: github.repository == 'Marks013/PerfectUtilitares'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only the unchanged and merged PR 52 head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: refactor/escalas-generation-references-2026-11-20
          EXPECTED_HEAD: e20e54c10e6ae787c43e7fdfe2daadea199818da
        run: |
          set -euo pipefail
          repo="Marks013/PerfectUtilitares"
          current_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || { echo "Main changed" >&2; exit 1; }
          merged="$(gh api "repos/$repo/pulls/52" --jq '.merged')"
          head="$(gh api "repos/$repo/pulls/52" --jq '.head.sha')"
          test "$merged" = "true" && test "$head" = "$EXPECTED_HEAD" || { echo "Unexpected PR 52 head" >&2; exit 1; }
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = "0" || { echo "Open PR detected" >&2; exit 1; }
          current_ref="$(gh api "repos/$repo/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$current_ref" = "$EXPECTED_HEAD" || { echo "Branch moved" >&2; exit 1; }
          gh api -X DELETE "repos/$repo/git/refs/heads/$TARGET_BRANCH" >/dev/null
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq 'map(.name) | join(",")')"
          test "$remaining" = "main" || { echo "Unexpected remaining branch(es): $remaining" >&2; exit 1; }
          echo "Success: only main remains"
