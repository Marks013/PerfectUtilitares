name: One-time PR 54 branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-pr54-once.yml
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: perfectutilitares-pr54-cleanup-once
  cancel-in-progress: false
jobs:
  prune-merged-branch:
    if: github.repository == 'Marks013/PerfectUtilitares'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove only the verified unchanged PR 54 head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: fix/escalas-publication-guidance-2026-11-20
          EXPECTED_HEAD: b8a12c399586438bc89d7b46012f1366315100c0
        run: |
          set -euo pipefail
          repo="Marks013/PerfectUtilitares"
          current_main="$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA" || { echo "main moved" >&2; exit 1; }
          merged="$(gh api "repos/$repo/pulls/54" --jq '.merged')"
          head="$(gh api "repos/$repo/pulls/54" --jq '.head.sha')"
          test "$merged" = "true" && test "$head" = "$EXPECTED_HEAD" || { echo "Unexpected PR 54 state" >&2; exit 1; }
          open_count="$(gh api "repos/$repo/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_count" = "0" || { echo "Open PR detected" >&2; exit 1; }
          current_ref="$(gh api "repos/$repo/git/ref/heads/$TARGET_BRANCH" --jq '.object.sha')"
          test "$current_ref" = "$EXPECTED_HEAD" || { echo "Branch changed" >&2; exit 1; }
          gh api -X DELETE "repos/$repo/git/refs/heads/$TARGET_BRANCH" >/dev/null
          remaining="$(gh api "repos/$repo/branches?per_page=100" --jq 'map(.name) | join(",")')"
          test "$remaining" = "main" || { echo "Unexpected remaining branches: $remaining" >&2; exit 1; }
          echo "Exactly one branch remains: main"
