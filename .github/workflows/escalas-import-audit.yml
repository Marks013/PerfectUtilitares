name: Escalas import audit
on:
  push:
    branches: [audit/escalas-importacao-segura-2026-11-20]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    defaults:
      run:
        working-directory: web
    env:
      PRISMA_ALLOW_LOCAL_FALLBACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - run: npm ci
      - name: Record source
        run: git rev-parse HEAD HEAD^{tree}
      - name: Focused regressions
        run: npx vitest run src/components/escalas/import-lifecycle.test.tsx src/components/escalas/absence-import.test.tsx src/components/escalas/coverage-auto.test.tsx src/components/escalas/import-reconciliation.test.ts
      - name: Check types and lint
        run: npm run typecheck && npm run lint && npm run quality:module-size
