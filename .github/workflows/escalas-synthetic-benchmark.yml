name: Escalas synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic-only workload; no private schedules
        type: choice
        options:
          - team-10-week
          - branch-50-four-weeks
          - branch-115-six-weeks
        default: team-10-week
      paired_seed:
        description: 'Manual synthetic diagnostic: force the same feasibility seed in both variants'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/escalas-synthetic-benchmark.yml
      - web/scripts/escalas/benchmark-synthetic.ts
      - web/src/lib/escalas/sunday-sector-observations.ts
      - web/ops/escalas/solver.py
      - web/ops/escalas/optimization.py
      - web/ops/escalas/weekend_balance.py

permissions:
  contents: read

concurrency:
  group: escalas-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measured solver baseline (synthetic)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      SCENARIOS: ${{ github.event_name == 'pull_request' && 'team-10-week branch-50-four-weeks branch-115-six-weeks' || inputs.scenario || 'team-10-week' }}
      PAIRED_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.paired_seed && 'true' || 'false' }}
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout entire history for pinned old baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Verify synthetic Sunday-Saturday inputs before benchmarking
        run: npm exec -- vitest run src/lib/escalas/benchmark-synthetic-input.test.ts
      - name: Build isolated solver only
        run: docker build --target runtime -t web-escalas-solver:latest ops/escalas
      - name: Log hardware and source identity
        run: |
          printf 'revision=%s\n' "$GITHUB_SHA"
          node --version
          npm --version
          uname -m
          nproc
          grep MemTotal /proc/meminfo
          docker image inspect web-escalas-solver:latest --format '{{.Id}}'
      - name: Run bounded synthetic comparison
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/escalas-benchmark.jsonl"
          # One job/runner for every PR scenario, so the hardware and image stay constant.
          # Workflow dispatch retains its original single-scenario selector.
          for scenario in $SCENARIOS; do
            printf '{"scenarios":["%s"],"variants":["baseline","corrected"],"repeats":5,"pairedSeed":%s}\n' "$scenario" "$PAIRED_SEED" \
              | npm run benchmark:escalas | tee -a "$RUNNER_TEMP/escalas-benchmark.jsonl"
          done
      - name: Capture shared-seed Sunday diagnosis (exploratory, non-gating)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # The normal strict benchmark is unchanged. Diagnose the 115/6 case
          # from one common synthetic feasibility roster in the same runner.
          printf '{"scenarios":["branch-115-six-weeks"],"variants":["baseline","corrected"],"repeats":5,"pairedSeed":true}\\n' \\
            | npm run benchmark:escalas | tee "$RUNNER_TEMP/escalas-paired-seed.jsonl"
      - name: Require independent validation and complete measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, math
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "escalas-benchmark.jsonl"
          data = []
          for line in path.read_text().splitlines():
              if line.startswith("{") and '"kind"' in line:
                  data.append(json.loads(line))
          scenarios = os.environ["SCENARIOS"].split()
          allowed = {"team-10-week", "branch-50-four-weeks", "branch-115-six-weeks"}
          assert scenarios and len(scenarios) == len(set(scenarios)), "Missing or repeated scenarios"
          assert all(scenario in allowed for scenario in scenarios), "Unsupported synthetic scenario"
          measured = [x for x in data if x.get("kind") == "measurement"]
          summary = [x for x in data if x.get("kind") == "summary"]
          for scenario in scenarios:
              for variant in ("baseline", "corrected"):
                  rows = [x for x in measured if x.get("variant") == variant and x.get("scenario") == scenario]
                  reports = [x for x in summary if x.get("variant") == variant and x.get("scenario") == scenario]
                  assert len(rows) == 5 and len(reports) == 1, "Incomplete benchmark samples"
                  assert reports[0].get("samples") == 5, "Missing repetitions"
                  for row in rows:
                      assert row.get("status") in ("FEASIBLE", "OPTIMAL"), "Unsolved scenario"
                      assert row.get("errors") == [], "Independent validation rejected output"
                      assert isinstance(row.get("seconds"), (int, float)) and math.isfinite(row["seconds"]), "Invalid duration"
                      assert isinstance(row.get("maxRssKiB"), (int, float)) and row["maxRssKiB"] > 0, "Invalid memory"
                      assert row.get("shortagePersonMinutes") is not None, "Missing coverage metric"
                      for key in ("sectorDaysAllOff", "sectorDaysWithoutKnownService", "sectorDaysWithUnverifiedPresence", "comparableOffSpread"):
                          assert type(row.get(key)) is int and row[key] >= 0, "Invalid Sunday sector metric: " + key
                  for key in ("medianSeconds", "p95Seconds", "peakRssKiB", "medianShortage",
                              "medianComparableSundayOffSpread", "medianSundaySectorDaysWithoutKnownService"):
                      assert reports[0].get(key) is not None, "Missing " + key
                  print(json.dumps(reports[0], sort_keys=True))
          assert len(measured) == len(scenarios) * 10 and len(summary) == len(scenarios) * 2, "Unexpected scenario data"
          # When Python sources differ, operational safety outranks cosmetic
          # Sunday fairness. Same-source variants provide instrumentation only.
          for scenario in scenarios:
              baseline = next(x for x in summary if x["scenario"] == scenario and x["variant"] == "baseline")
              corrected = next(x for x in summary if x["scenario"] == scenario and x["variant"] == "corrected")
              sources = {}
              for variant in ("baseline", "corrected"):
                  hashes = {row.get("sourceHash") for row in measured
                            if row["scenario"] == scenario and row["variant"] == variant}
                  assert len(hashes) == 1 and next(iter(hashes)), "Missing or inconsistent solver source hash"
                  sources[variant] = next(iter(hashes))
              if sources["baseline"] == sources["corrected"]:
                  print("Same-source benchmark: only independent validation is enforced for " + scenario)
                  continue
              for metric in ("medianShortage", "medianComparableSundayOffSpread",
                             "medianSundaySectorDaysWithoutKnownService"):
                  reference = baseline[metric]
                  candidate = corrected[metric]
                  assert isinstance(reference, (int, float)) and isinstance(candidate, (int, float)), "Invalid " + metric
                  assert math.isfinite(reference) and math.isfinite(candidate), "Non-finite " + metric
                  assert candidate <= reference, (
                      "REGRESSION " + scenario + " " + metric + ": " + str(reference) + " -> " + str(candidate))
              print("No measured coverage/Sunday spread regression for " + scenario)
          print("Benchmark: 5 synthetic repetitions per variant/scenario, independent rules checked.")
          PY
      - name: Keep metrics, never private rosters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escalas-synthetic-metrics
          path: |
            ${{ runner.temp }}/escalas-benchmark.jsonl
            ${{ runner.temp }}/escalas-paired-seed.jsonl
          if-no-files-found: ignore
          retention-days: 7
