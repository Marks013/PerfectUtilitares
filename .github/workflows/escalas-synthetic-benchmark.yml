name: Escalas synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic-only workload; no private schedules
        type: choice
        options:
          - team-10-week
          - branch-50-four-weeks
          - branch-115-six-weeks
          - branch-115-six-weeks-untimed
        default: team-10-week
      repeats:
        description: '5 exploratory repetitions or 20 for p95 (manual, single scenario)'
        type: choice
        options:
          - '5'
          - '20'
        default: '5'
  pull_request:
    paths:
      - .github/workflows/escalas-synthetic-benchmark.yml
      - web/ops/escalas/**
      - web/scripts/escalas/benchmark-*.ts
      - web/scripts/escalas/verify-synthetic-metrics.py
      - web/scripts/escalas/test_verify_synthetic_metrics.py
      - web/src/lib/escalas/benchmark-synthetic-input.test.ts
      - web/src/lib/escalas/sunday-sector-observations.ts
      - web/src/lib/escalas/sunday-sector-observations.test.ts
      - web/src/lib/escalas/coverage-presence.ts
      - web/src/lib/escalas/validation.ts
      - web/src/lib/escalas/generation.ts
      - web/src/lib/escalas/preparation.ts

permissions:
  contents: read

concurrency:
  group: escalas-synthetic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measured solver evidence (synthetic)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      SCENARIOS: ${{ github.event_name == 'pull_request' && 'team-10-week branch-50-four-weeks branch-115-six-weeks branch-115-six-weeks-untimed' || inputs.scenario || 'team-10-week' }}
      REPEATS: ${{ github.event_name == 'pull_request' && '5' || inputs.repeats || '5' }}
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout entire history for pinned old baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test synthetic metrics verifier
        run: python3 -m unittest discover -s scripts/escalas -p 'test_verify_synthetic_metrics.py'
      - name: Verify synthetic Sunday-Saturday inputs before benchmarking
        run: npm exec -- vitest run src/lib/escalas/benchmark-synthetic-input.test.ts
      - name: Build isolated solver only
        run: docker build --target runtime -t web-escalas-solver:latest ops/escalas
      - name: Log hardware and source identity
        run: |
          printf 'revision=%s\n' "$GITHUB_SHA"
          node --version
          npm --version
          uname -m
          nproc
          grep MemTotal /proc/meminfo
          docker image inspect web-escalas-solver:latest --format '{{.Id}}'
      - name: Run bounded synthetic comparison
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/escalas-benchmark.jsonl"
          # One job/runner for every PR scenario, so the hardware and image stay constant.
          # Workflow dispatch retains its original single-scenario selector.
          for scenario in $SCENARIOS; do
            printf '{"scenarios":["%s"],"variants":["baseline","corrected"],"repeats":%s}\n' "$scenario" "$REPEATS" \
              | npm run benchmark:escalas | tee -a "$RUNNER_TEMP/escalas-benchmark.jsonl"
          done
      - name: Require independent validation and complete measurements
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/escalas/verify-synthetic-metrics.py \
            "$RUNNER_TEMP/escalas-benchmark.jsonl" "$REPEATS" $SCENARIOS
      - name: Keep metrics, never private rosters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escalas-synthetic-metrics
          path: ${{ runner.temp }}/escalas-benchmark.jsonl
          if-no-files-found: ignore
          retention-days: 7
