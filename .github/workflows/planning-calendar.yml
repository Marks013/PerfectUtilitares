name: Planning calendar parity

on:
  pull_request:
    paths:
      - 'web/src/lib/escalas/**'
      - 'web/ops/escalas/**'
      - 'web/scripts/escalas/planning-calendar.test.mjs'
      - '.github/workflows/planning-calendar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-calendar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calendar:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Check Python calendar
        working-directory: web
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s ops/escalas -p 'test_planning_calendar.py' -v
      - name: Check TypeScript calendar and cross-language parity
        if: ${{ !cancelled() }}
        working-directory: web
        run: node --experimental-strip-types --test scripts/escalas/planning-calendar.test.mjs
