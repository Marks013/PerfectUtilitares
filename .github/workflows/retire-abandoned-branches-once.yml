name: One-time authorized branch retirement
on:
  push:
    branches: [experiment/solverforge-consolidado-2026-11-26]
    paths: [.github/workflows/retire-abandoned-branches-once.yml]
permissions: {}
concurrency:
  group: authorized-branch-retirement-20261127
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Validate exact heads and remove only the ten authorized branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          repository = 'Marks013/PerfectUtilitares'
          assert os.environ['GITHUB_REPOSITORY'] == repository
          keep = {'main': 'f78c691edbeaf16283f534bcacd8db1b4b7d5e66',
                  'experiment/solverforge-consolidado-2026-11-26': os.environ['GITHUB_SHA']}
          targets = {
              'codex/escalas-importacao-validacao-20261123': 'e1750a68842f04753892ac1ed5a04dea10d242d9',
              'docs/timefold-replacement-plan-2026-11-25': '1dad0bff3f32b1b8f2a89d9184532b4f1aefcf82',
              'experiment/escalas-cross-engine-e0-e1-2026-11-25': '7387733c9fcb6b8ea0932dd5f323d58798ee138f',
              'experiment/escalas-solverforge-2026-11-25': 'ce0293f22eb67ab67ef4196a0d5518db48b46162',
              'experiment/escalas-timefold-e2-2026-11-25': 'a6216755306335f0aae2c86bacaee0a70bd46007',
              'experiment/escalas-timefold-e2-hardening-2026-11-25': '997d79d70781084c1547cacdb7b7e037163676b6',
              'experiment/escalas-timefold-e2-quality-2026-11-25': '217427e0032b9d187c9e740a8708ffd551424f85',
              'experiment/solverforge-regression-hardening-2026-11-26': '0faf1acd32f00d44f75783da1f2dc9439297fa6f',
              'fix/escalas-coverage-solver-20261124': '3f0c38d132d49878b01a478f78051d6945c543cb',
              'fix/escalas-folgas-operacionais': 'c536cbc172f136695d7a86de5462cd8a4eabf09e',
          }
          assert len(targets) == 10 and not set(targets) & set(keep)
          base = 'https://api.github.com/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                     'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def call(path, method='GET'):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  if method == 'DELETE':
                      assert response.status == 204
                      return None
                  return json.loads(body)
          def branches():
              result = {}
              for page in range(1, 101):
                  rows = call('/branches?per_page=100&page=' + str(page))
                  for row in rows:
                      assert row['name'] not in result
                      result[row['name']] = row
                  if len(rows) < 100:
                      return result
              raise RuntimeError('Unbounded branch collection')
          def ref(name):
              return '/git/refs/heads/' + urllib.parse.quote(name, safe='/')
          before = branches()
          assert set(before) == set(keep) | set(targets), 'Unexpected branch set; no removal authorized'
          assert call('')['default_branch'] == 'main'
          assert not call('/pulls?state=open&per_page=100'), 'Close superseded PRs first'
          for name, sha in {**keep, **targets}.items():
              assert before[name]['commit']['sha'] == sha, 'Changed head: ' + name
              if name in targets:
                  assert before[name]['protected'] is False, 'Protected target: ' + name
          before_tags = call('/git/matching-refs/tags/')
          report = {'before': {n:r['commit']['sha'] for n,r in before.items()}, 'deleted': [], 'kept': keep}
          for name, sha in targets.items():
              current = call(ref(name))
              assert current['ref'] == 'refs/heads/' + name and current['object']['sha'] == sha
              assert name not in keep
              call(ref(name), 'DELETE')
              report['deleted'].append({'branch': name, 'sha': sha})
              print(json.dumps(report['deleted'][-1]))
          after = branches()
          assert {n:r['commit']['sha'] for n,r in after.items()} == keep
          assert call('/git/matching-refs/tags/') == before_tags, 'Unexpected tag changes'
          assert not call('/pulls?state=open&per_page=100')
          report['after'] = {n:r['commit']['sha'] for n,r in after.items()}
          report['tagsUnchanged'] = True
          report['openPullRequests'] = 0
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              '# Branch retirement verified\n\nTen explicitly authorized branches removed; only main and consolidated SolverForge remain.\n\n'
              'No merge, deployment, ruleset change or tag deletion.\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          print(json.dumps(report))
          PY
