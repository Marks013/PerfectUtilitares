name: SolverForge source-object transport - not qualification
on:
  push:
    branches: [experiment/solverforge-consolidado-2026-11-26]
    paths: [.github/workflows/solverforge-migration-stage.yml]
permissions:
  contents: write
concurrency:
  group: solverforge-migration-object-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'Marks013/PerfectUtilitares' && github.ref == 'refs/heads/experiment/solverforge-consolidado-2026-11-26'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 8
          persist-credentials: false
      - name: Verify exact source tree and store blobs only
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import PurePosixPath
          from concurrent.futures import ThreadPoolExecutor
          base='5732c4e21d793a0e22149907cd3e78e563a1ed05'
          expected='d13b9b5ae5db7484220fc3a11c19a904ff50ba06'
          digest='4bef290199397718e759818b3cfeb278b10979511e559deda70d6bd47f9380fa'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          with urllib.request.urlopen('https://sb-5a65yacf76ta.vercel.run/'+digest+'.json.gz',timeout=30) as response:
              data=response.read(100001)
          assert len(data)==45643 and hashlib.sha256(data).hexdigest()==digest
          capsule=json.loads(gzip.decompress(data))
          assert capsule['base']==base and capsule['tree']==expected
          assert capsule['baseTree']=='937be14c7fe2567ac8de07c34903bdd710f651b7'
          assert len(capsule['items'])==91
          allowed=('web/ops/escalas/','web/experiments/escalas-solverforge/','web/scripts/','docs/superpowers/plans/')
          extra={'web/docker-compose.yml','.github/workflows/ci.yml','.github/workflows/escalas-synthetic-benchmark.yml','.github/workflows/escalas-solverforge-compile.yml','web/src/lib/escalas/roster-refinement.ts'}
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          env={**os.environ,'GIT_INDEX_FILE':os.environ['RUNNER_TEMP']+'/migration.index'}
          subprocess.run(['git','read-tree',base],env=env,check=True)
          seen=set();objects=[]
          for item in capsule['items']:
              name=item['path'];path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and name not in seen
              assert name.startswith(allowed) or name in extra
              assert item['mode'] in ('100644','100755')
              seen.add(name)
              old=subprocess.run(['git','show',base+':'+name],capture_output=True)
              original=old.stdout if old.returncode==0 else b''
              assert (blob(original) if old.returncode==0 else None)==item['old']
              if item['new'] is None:
                  assert item['old'] is not None
                  subprocess.run(['git','update-index','--force-remove','--',name],env=env,check=True)
                  continue
              lines=original.decode('utf-8').splitlines(keepends=True);pieces=[]
              for part in item['parts']:
                  if isinstance(part,list):
                      assert len(part)==2 and all(type(v) is int for v in part) and 0<=part[0]<=part[1]<=len(lines)
                      pieces.append(''.join(lines[part[0]:part[1]]))
                  else:
                      assert isinstance(part,str)
                      pieces.append(part)
              result=''.join(pieces).encode('utf-8');assert blob(result)==item['new']
              actual=subprocess.check_output(['git','hash-object','-w','--stdin'],input=result).decode().strip()
              assert actual==item['new']
              subprocess.run(['git','update-index','--add','--cacheinfo',item['mode'],actual,name],env=env,check=True)
              objects.append((actual,result))
          assert subprocess.check_output(['git','write-tree'],env=env,text=True).strip()==expected
          assert os.environ['GITHUB_REPOSITORY']=='Marks013/PerfectUtilitares'
          assert os.environ['GITHUB_REF']=='refs/heads/experiment/solverforge-consolidado-2026-11-26'
          token=os.environ.pop('GH_OBJECT_TOKEN')
          root='https://api.github.com/repos/Marks013/PerfectUtilitares/'
          def api(path,data=None):
              request=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          assert api('git/ref/heads/experiment/solverforge-consolidado-2026-11-26')['object']['sha']==os.environ['GITHUB_SHA']
          def store(item):
              sha,data=item
              assert api('git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})['sha']==sha
          with ThreadPoolExecutor(max_workers=4) as workers:list(workers.map(store,objects))
          print('VERIFIED_SOURCE_TREE='+expected)
          print('BLOBS_STORED='+str(len(objects)))
          print('QUALIFICATION=false; NO_TREE_API=true; NO_REF_UPDATED=true; NO_DOWNLOADED_CODE_EXECUTED=true')
          PY
