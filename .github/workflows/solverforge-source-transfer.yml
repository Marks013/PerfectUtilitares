name: SolverForge source object transfer - not release qualification
on:
  push:
    branches: [experiment/solverforge-consolidado-2026-11-26]
    paths: [.github/workflows/solverforge-source-transfer.yml]
permissions:
  contents: write
concurrency:
  group: solverforge-source-object-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'Marks013/PerfectUtilitares' && github.ref == 'refs/heads/experiment/solverforge-consolidado-2026-11-26'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Store only verified source blobs; do not change a ref or qualify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,os,subprocess,urllib.request
          base='00df1500e77676bdf12b1806aaecc5d1420035dd'
          digest='9ac208af248ac581daa961619156906a36abf6726aff6a618c6f23fb013be70a'
          assert os.environ['GITHUB_REPOSITORY']=='Marks013/PerfectUtilitares'
          assert os.environ['GITHUB_REF']=='refs/heads/experiment/solverforge-consolidado-2026-11-26'
          url='https://sb-5a65yacf76ta.vercel.run/'+digest+'.json.gz'
          with urllib.request.urlopen(url,timeout=20) as response:
              raw=response.read(262145)
          assert len(raw)<=262144 and hashlib.sha256(raw).hexdigest()==digest
          content=gzip.decompress(raw)
          assert len(content)<=262144
          capsule=json.loads(content)
          assert capsule['base']==base and capsule['tree']=='c132641aaccca05e9e99c930061edcf1c574ff8d'
          allowed={'web/experiments/escalas-solverforge/src/temporal.rs',
                   'web/experiments/escalas-solverforge/src/temporal/feasibility.rs',
                   'web/experiments/escalas-solverforge/src/temporal/rules/witnesses.rs',
                   'web/experiments/escalas-solverforge/src/temporal/service_clocks.rs',
                   'web/experiments/escalas-solverforge/src/temporal/service_contract_tests.rs',
                   'web/ops/escalas/native_runner.py','web/ops/escalas/test_native_runner.py',
                   'web/ops/escalas/test_service.py'}
          assert len(capsule['items'])==8 and {x['path'] for x in capsule['items']}==allowed
          def blob(value):
              return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          for item in capsule['items']:
              path=item['path']
              assert item['mode']=='100644'
              old=subprocess.run(['git','show',base+':'+path],capture_output=True)
              if item['old'] is None:
                  assert old.returncode!=0
                  previous=b''
              else:
                  assert old.returncode==0 and blob(old.stdout)==item['old']
                  previous=old.stdout
              lines=previous.decode('utf-8').splitlines(True)
              pieces=[]
              for part in item['parts']:
                  if isinstance(part,list):
                      assert len(part)==2 and all(type(n) is int for n in part)
                      a,b=part
                      assert 0<=a<=b<=len(lines)
                      pieces.append(''.join(lines[a:b]))
                  else:
                      assert isinstance(part,str)
                      pieces.append(part)
              text=''.join(pieces)
              assert blob(text.encode('utf-8'))==item['new']
              request=urllib.request.Request('https://api.github.com/repos/Marks013/PerfectUtilitares/git/blobs',
                  data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),method='POST',
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json',
                           'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=20) as response:
                  result=json.load(response)
              assert result['sha']==item['new']
              print(path,result['sha'])
          print('Source objects stored only. No branch ref changed. No release qualification.')
          PY
