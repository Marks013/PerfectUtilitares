name: SolverForge source object transfer - not release qualification
on:
  push:
    branches: [experiment/solverforge-consolidado-2026-11-26]
    paths: [.github/workflows/solverforge-source-transfer.yml]
permissions: {}
jobs:
  source-objects-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d445f7f7f9a9c8208049ef0c8cd16f2fd3be0fc9
          fetch-depth: 1
          persist-credentials: false
      - name: Store exact verified source blobs; do not update refs or qualify release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          base = 'd445f7f7f9a9c8208049ef0c8cd16f2fd3be0fc9'
          digest = 'b3e45649c28d8ecef004dafd21373be5085c08d380352b3f8f0d54f0cad48396'
          url = 'https://sb-5a65yacf76ta.vercel.run/' + digest + '.json.gz'
          with urllib.request.urlopen(url, timeout=30) as response:
              packed = response.read(1048577)
          assert len(packed) == 8582 and hashlib.sha256(packed).hexdigest() == digest
          with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:
              raw = stream.read(2000001)
          assert len(raw) <= 2000000
          capsule = json.loads(raw)
          assert capsule['base'] == base and len(capsule['items']) == 14
          allowed = {
              'web/experiments/escalas-solverforge/src/temporal.rs',
              'web/experiments/escalas-solverforge/src/temporal/boundary_tests.rs',
              'web/experiments/escalas-solverforge/src/temporal/comparison.rs',
              'web/experiments/escalas-solverforge/src/temporal/feasibility.rs',
              'web/experiments/escalas-solverforge/src/temporal/incremental.rs',
              'web/experiments/escalas-solverforge/src/temporal/rules.rs',
              'web/experiments/escalas-solverforge/src/temporal/seed.rs',
              'web/experiments/escalas-solverforge/src/temporal/service_bounds.rs',
              'web/experiments/escalas-solverforge/src/temporal/service_clocks.rs',
              'web/experiments/escalas-solverforge/src/temporal/service_guard.rs',
              'web/experiments/escalas-solverforge/src/temporal_domain/employee.rs',
              'web/ops/escalas/solver.py',
              'web/ops/escalas/test_civil_occupancy.py',
              'web/ops/escalas/test_service.py',
          }
          assert {item['path'] for item in capsule['items']} == allowed
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          verified = []
          for item in capsule['items']:
              path = item['path']
              assert item['mode'] == '100644' and '..' not in pathlib.PurePosixPath(path).parts
              old = subprocess.run(['git', 'show', base + ':' + path], capture_output=True)
              if item['old'] is None:
                  assert old.returncode != 0
                  original = b''
              else:
                  assert old.returncode == 0 and blob(old.stdout) == item['old']
                  original = old.stdout
              lines = original.decode('utf-8').splitlines(True)
              parts = []
              for part in item['parts']:
                  if isinstance(part, str):
                      parts.append(part)
                  else:
                      assert isinstance(part, list) and len(part) == 2
                      a, b = part
                      assert type(a) is int and type(b) is int and 0 <= a <= b <= len(lines)
                      parts.append(''.join(lines[a:b]))
              content = ''.join(parts)
              assert blob(content.encode('utf-8')) == item['new']
              verified.append((path, content, item['new']))
          for path, content, expected in verified:
              request = urllib.request.Request(
                  'https://api.github.com/repos/Marks013/PerfectUtilitares/git/blobs',
                  data=json.dumps({'content': content, 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected
              print(json.dumps({'path': path, 'sha': expected}))
          print('Source objects stored; no reference update, test qualification, merge or deployment performed.')
          PY
