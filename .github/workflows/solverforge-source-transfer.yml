name: SolverForge source object transfer - not release qualification
on:
  push:
    branches: [experiment/solverforge-consolidado-2026-11-26]
    paths: [.github/workflows/solverforge-source-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'Marks013/PerfectUtilitares' && github.ref == 'refs/heads/experiment/solverforge-consolidado-2026-11-26'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c08e5a588c21902fd99b8be83156a12bac89aabe
          fetch-depth: 1
          persist-credentials: false
      - name: Store verified blobs only; do not execute source, change refs or approve release
        env:
          GH_OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          base='c08e5a588c21902fd99b8be83156a12bac89aabe'
          digest='856a06f1cf278eec09dcef30cf5aa72381d7886a20a406fffbfa8332b2b57734'
          assert os.environ['GITHUB_REPOSITORY']=='Marks013/PerfectUtilitares'
          assert os.environ['GITHUB_REF']=='refs/heads/experiment/solverforge-consolidado-2026-11-26'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==base
          token=os.environ.pop('GH_OBJECT_TOKEN')
          url='https://sb-5a65yacf76ta.vercel.run/'+digest+'.json.gz'
          with urllib.request.urlopen(url,timeout=20) as response:compressed=response.read(20000)
          assert len(compressed)==6789 and hashlib.sha256(compressed).hexdigest()==digest
          data=gzip.decompress(compressed)
          assert len(data)<300000
          capsule=json.loads(data);assert capsule['base']==base
          allowed={
              'web/experiments/escalas-solverforge/src/temporal.rs',
              'web/experiments/escalas-solverforge/src/temporal/feasibility.rs',
              'web/experiments/escalas-solverforge/src/temporal/report.rs',
              'web/experiments/escalas-solverforge/src/temporal/service_contract_tests.rs',
              'web/ops/escalas/test_service.py',
          }
          assert len(capsule['items'])==len(allowed)
          seen=set()
          def blob(value):return hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()
          for item in capsule['items']:
              name=item['path'];assert name in allowed and name not in seen and item['mode']=='100644';seen.add(name)
              previous=subprocess.run(['git','show',base+':'+name],capture_output=True)
              old=previous.stdout if previous.returncode==0 else b''
              assert (blob(old) if previous.returncode==0 else None)==item['old']
              lines=old.decode('utf-8').splitlines(keepends=True);pieces=[]
              for part in item['parts']:
                  if isinstance(part,list):
                      assert len(part)==2 and all(type(v) is int for v in part) and 0<=part[0]<=part[1]<=len(lines)
                      pieces.append(''.join(lines[part[0]:part[1]]))
                  else:
                      assert isinstance(part,str);pieces.append(part)
              content=''.join(pieces).encode('utf-8');assert blob(content)==item['new']
              request=urllib.request.Request('https://api.github.com/repos/Marks013/PerfectUtilitares/git/blobs',
                  data=json.dumps({'encoding':'base64','content':base64.b64encode(content).decode()}).encode(),
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:stored=json.load(response)
              assert stored['sha']==item['new'];print(name,stored['sha'])
          assert seen==allowed
          print('SOURCE_BLOBS_VERIFIED=true; RELEASE_APPROVAL=false; NO_REF_UPDATED=true')
          PY
