x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

x-runtime-hardening: &runtime-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    <<: *runtime-hardening
    image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?execute npm run setup:env antes do docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-perfectutilitares}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    expose:
      - "5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-../storage/postgres}:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=3775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-perfectutilitares}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: "${DB_CPU_LIMIT:-1.0}"
    mem_limit: ${DB_MEMORY_LIMIT:-1536m}
    mem_reservation: ${DB_MEMORY_RESERVATION:-512m}
    pids_limit: 256

  migrate:
    <<: *runtime-hardening
    build:
      context: .
      target: migrator
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?execute npm run setup:env antes do docker compose}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-Principal}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-principal}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perfectutilitares}?schema=public"
      DATABASE_POOL_MAX: ${MIGRATE_DATABASE_POOL_MAX:-2}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-300000}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=1770
    cpus: "${MIGRATE_CPU_LIMIT:-0.5}"
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    pids_limit: 128

  app:
    <<: *runtime-hardening
    build:
      context: .
      target: runner
      secrets:
        - sentry_auth_token
      args:
        AUTH_URL: ${AUTH_URL:-http://localhost:3002}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3002}
        APP_URL: ${APP_URL:-http://localhost:3002}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    env_file:
      - path: ${UNIMED_ACCESS_ENV_FILE:-/home/ubuntu/perfectutilitares-config/unimed/access.env}
        required: false
        format: raw
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      AUTH_SECRET: ${AUTH_SECRET:?execute npm run setup:env antes do docker compose}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3002}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3002}
      APP_URL: ${APP_URL:-http://localhost:3002}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?execute npm run setup:env antes do docker compose}
      DEFAULT_TENANT_NAME: ${DEFAULT_TENANT_NAME:-Principal}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-principal}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perfectutilitares}?schema=public"
      DATABASE_POOL_MAX: ${APP_DATABASE_POOL_MAX:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-300000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Departamento Pessoal}
      UNIMED_EMAIL_SIGNATURE_URL: ${UNIMED_EMAIL_SIGNATURE_URL:-https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi0wOmIf_vL4iasN_lQEurWxAA2-ssiov-epwgZ2iprtRbPuxTypYvHIYlKkcEKS1QK2pLyENS4YOVFgsvp9E28ZJ5FpbLZORKS92b_ssQhkN5MFMBaQamVeV5aB2TdOgYNE083gvfXVBSDmJSx_aBkcAU5AqaWFraEyAD5vqnEOwUcwZfwdcTyjKXy/s320/45ed08d31e851604dcd0ba65ed259804.jpg}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE: ${SENTRY_REPLAYS_ON_ERROR_SAMPLE_RATE:-1.0}
      SENTRY_REPLAYS_SESSION_SAMPLE_RATE: ${SENTRY_REPLAYS_SESSION_SAMPLE_RATE:-0.0}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      PDF_ANONYMOUS_SESSION_TTL_MINUTES: ${PDF_ANONYMOUS_SESSION_TTL_MINUTES:-120}
      PDF_STORAGE_DIR: /data/pdf-jobs
      UNIMED_TEMPLATE_DIR: /data/unimed-templates
      PDF_MAX_ACTIVE_JOBS: ${PDF_MAX_ACTIVE_JOBS:-12}
      PDF_MAX_ACTIVE_INPUT_BYTES: ${PDF_MAX_ACTIVE_INPUT_BYTES:-4294967296}
      PDF_MAX_PUBLIC_ACTIVE_JOBS: ${PDF_MAX_PUBLIC_ACTIVE_JOBS:-2}
      STORAGE_BLOCK_USED_PERCENT: ${STORAGE_BLOCK_USED_PERCENT:-80}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-32212254720}
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    volumes:
      - ${PDF_DATA_DIR:-../storage/pdf-jobs}:/data/pdf-jobs
      - ${UNIMED_TEMPLATE_DIR:-../storage/unimed-templates}:/data/unimed-templates:ro
      - /var/lib/server-resource-guard:/run/server-resource-guard:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=${APP_UID:-1001},gid=${APP_GID:-1001},mode=1770
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=${APP_UID:-1001},gid=${APP_GID:-1001},mode=0770
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "/usr/local/bin/app-readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpus: "${APP_CPU_LIMIT:-1.5}"
    mem_limit: ${APP_MEMORY_LIMIT:-2g}
    mem_reservation: ${APP_MEMORY_RESERVATION:-512m}
    pids_limit: 384

  pdf-worker:
    <<: *runtime-hardening
    build:
      context: .
      target: pdf-worker
    restart: unless-stopped
    init: true
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-perfectutilitares}?schema=public"
      DATABASE_POOL_MAX: ${PDF_WORKER_DATABASE_POOL_MAX:-5}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-300000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      PDF_STORAGE_DIR: /data/pdf-jobs
      PDF_WORKER_AUTHENTICATED_GROUP_CONCURRENCY: ${PDF_WORKER_AUTHENTICATED_GROUP_CONCURRENCY:-2}
      PDF_WORKER_CONCURRENCY: ${PDF_WORKER_CONCURRENCY:-2}
      PDF_WORKER_HEARTBEAT_PATH: /tmp/perfect-pdf-worker-heartbeat
      PDF_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${PDF_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-90}
      STORAGE_BLOCK_USED_PERCENT: ${STORAGE_BLOCK_USED_PERCENT:-80}
      STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-32212254720}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    user: "${APP_UID:-1001}:${APP_GID:-1001}"
    volumes:
      - ${PDF_DATA_DIR:-../storage/pdf-jobs}:/data/pdf-jobs
      - /var/lib/server-resource-guard:/run/server-resource-guard:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=${APP_UID:-1001},gid=${APP_GID:-1001},mode=1770
    healthcheck:
      test: ["CMD", "/usr/local/bin/pdf-worker-healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    stop_grace_period: 45s
    cpus: "${PDF_WORKER_CPU_LIMIT:-2.0}"
    mem_limit: ${PDF_WORKER_MEMORY_LIMIT:-4g}
    mem_reservation: ${PDF_WORKER_MEMORY_RESERVATION:-1g}
    pids_limit: 512

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
